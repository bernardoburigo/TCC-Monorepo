spring.application.name=backend

management.endpoints.web.exposure.include=health,info
# "always" exporia detalhes de banco/disco publicamente (o endpoint é permitAll());
# "when-authorized" exige um usuário autenticado no Actuator Security, que não
# configuramos — na prática vira "nunca", status UP/DOWN continua visível.
management.endpoint.health.show-details=when-authorized

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcc_telemetria}
spring.datasource.username=${DB_USER:tcc}
spring.datasource.password=${DB_PASSWORD:tcc}

# Schema é gerenciado pelo Flyway (db/migration); Hibernate só valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Valor de dev fixo (sobrescrito por JWT_SECRET em produção/deploy real).
jwt.secret=${JWT_SECRET:dev-secret-tcc-telemetria-troque-em-producao-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Propriedades da aplicação (ver config/AppProperties). Sobrescrevíveis por variável de ambiente
# (APP_TIMEZONE, APP_CORS_ALLOWED_ORIGINS, APP_SENSOR_OFFLINE_APOS_SEGUNDOS).
# Fuso de "hoje" e do agrupamento hora/dia do consumo.
app.timezone=America/Sao_Paulo
# Origens do app Expo Web em desenvolvimento (Metro 8081; 19006 = porta antiga do Expo Web).
app.cors.allowed-origins=http://localhost:8081,http://localhost:19006
# Sem leitura recebida há mais que isso => sensor OFFLINE (firmware envia a cada 5 s).
app.sensor.offline-apos-segundos=30
# Segredo do header X-Admin-Token do POST /api/auth/registrar; vazio = registro desativado.
app.registro.admin-token=${APP_REGISTRO_ADMIN_TOKEN:}
