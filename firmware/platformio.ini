; Sprint 3: firmware com Wi-Fi (WiFiManager), NTP e POST periodico para a API.
; env:esp32dev compila para a placa real. `-t upload` so com o ESP32 conectado.
; env:native roda os testes das libs puras (FlowMeter, LeituraPayload, SendQueue)
; direto no host, sem hardware.
; Versoes fixadas de proposito: o build precisa ser reprodutivel para o TCC.

[env:esp32dev]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
test_framework = unity
build_flags = -D UNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson@7.4.3
